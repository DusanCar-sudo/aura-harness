[package]
name = "harness-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aura-harness"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
uuid.workspace = true
chrono.workspace = true
toml.workspace = true
base64.workspace = true

eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.29"
egui_commonmark = { version = "0.18", features = ["better_syntax_highlighting"] }
egui_extras = { version = "0.29", features = ["image"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
